timeline:
  start: 2026-07        # simulation start
  horizon: 2061         # expected-lifetime endpoint
  step: monthly

buckets:                 # taxable/pretax/roth share the "equity" return; real_estate has its own
  taxable: 0             # brokerage + cash equivalents
  pretax: 0              # 401k / trad IRA
  roth: 0
  real_estate: 0         # real estate equity / private investments, illiquid (not drawn on in retirement)

contributions:          # monthly, pre-retirement, off the top of surplus
  pretax: 0
  roth: 0

income:
  surplus: 0            # monthly investable surplus while working (after living
                         # expenses and minimum debt service at ORIGINAL schedule)
  rental_net: 0          # monthly net rental income, tracks inflation

liabilities:              # named loans; scenario alloc/recast levers key off these names
  loan_a:                 # home mortgage: IO -> amortizing (Shellpoint-style)
    type: io_amortizing
    balance: 0
    rate: 0.0
    io_until: 2031        # conversion year
    amort_years: 25       # recast term at conversion
  loan_b:                 # rental property mortgage: standard amortizing
    type: standard_amortizing
    balance: 0
    rate: 0.0
    years_left: 0
  loan_c:                 # Schwab margin loan: revolving interest-only, no fixed term
    type: revolving_interest_only
    balance: 0
    rate: 0.0
  loan_d:                 # RJ SBL (securities-based line): revolving interest-only
    type: revolving_interest_only
    balance: 0
    rate: 0.0
  loan_e:                 # credit card debt: revolving, minimum payment nibbles principal
    type: revolving_interest_only
    balance: 0
    rate: 0.0
    min_payment_pct: 0.02  # minimum payment as % of balance; 0 = pure interest-only

social_security:          # claim ladder, both people; today's $, COLA-flat in real terms
  person1:
    - {age: 62, year: 0000, monthly: 0}
    - {age: 65, year: 0000, monthly: 0}
    - {age: 67, year: 0000, monthly: 0}
    - {age: 70, year: 0000, monthly: 0}
  person2:
    - {age: 62, year: 0000, monthly: 0}
    - {age: 65, year: 0000, monthly: 0}
    - {age: 67, year: 0000, monthly: 0}
    - {age: 70, year: 0000, monthly: 0}
